<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>猫狗说快讯 · v5 动态讲解</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"PingFang SC","Helvetica Neue",sans-serif}
  .page{position:relative;width:1080px;height:1920px;overflow:hidden;background:linear-gradient(180deg,#fdf8ee 0%,#f7efdd 55%,#f1e6ca 100%)}
  .paper{position:absolute;inset:0;opacity:.35;background-image:radial-gradient(circle at 20% 30%,rgba(120,90,40,.05) 0,transparent 1px),radial-gradient(circle at 70% 60%,rgba(120,90,40,.05) 0,transparent 1px);background-size:18px 18px}

  .topbar{position:absolute;top:50px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;z-index:5}
  .brand{font-size:30px;font-weight:900;color:#5a3d1c;letter-spacing:.04em}
  .brand small{font-size:18px;color:#a08060;font-weight:600;margin-left:12px}
  .date{font-size:22px;color:#a08060;font-weight:600}

  /* 动态讲解区 */
  .visual{position:absolute;top:130px;left:80px;right:80px;height:640px;border-radius:30px;overflow:hidden;background:#1a1a2e;box-shadow:0 14px 40px rgba(80,55,20,.15);z-index:2}
  .scene{position:absolute;inset:0;opacity:0;transition:opacity .5s}
  .scene.active{opacity:1}
  .visual .tag{position:absolute;top:20px;left:20px;background:rgba(0,0,0,.55);color:#fff;font-size:20px;font-weight:700;padding:8px 18px;border-radius:20px;backdrop-filter:blur(6px);z-index:10}

  /* ===== Kimi 场景：浏览器录制 ===== */
  .scene-kimi{background:linear-gradient(135deg,#6366f1,#8b5cf6)}
  .browser{position:absolute;top:70px;left:50%;transform:translateX(-50%);width:820px;height:500px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .browser-bar{height:44px;background:#e9e9ef;display:flex;align-items:center;padding:0 16px;gap:8px}
  .dot{width:12px;height:12px;border-radius:50%}
  .dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
  .url{flex:1;height:28px;background:#fff;border-radius:14px;margin-left:12px;display:flex;align-items:center;padding:0 16px;font-size:15px;color:#888}
  .browser-body{position:relative;height:calc(100% - 44px);background:#fafafa;padding:30px}
  .web-title{font-size:26px;font-weight:800;color:#333;margin-bottom:20px}
  .web-row{display:flex;align-items:center;gap:16px;margin-bottom:18px;padding:16px;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .web-row .ico{width:48px;height:48px;border-radius:10px;background:#e0e7ff;display:flex;align-items:center;justify-content:center;font-size:24px}
  .web-row .t{font-size:20px;font-weight:700;color:#333}
  .web-row .d{font-size:15px;color:#999;margin-top:2px}
  /* 录制步骤面板 */
  .steps{position:absolute;right:24px;top:14px;width:300px;background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.15);padding:14px;z-index:5}
  .steps h4{font-size:16px;font-weight:800;color:#333;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .rec{width:10px;height:10px;border-radius:50%;background:#ef4444;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.3}}
  .step{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;font-size:15px;color:#555;opacity:0;transform:translateX(10px);animation:stepIn .4s forwards}
  .step .num{width:22px;height:22px;border-radius:50%;background:#6366f1;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
  @keyframes stepIn{to{opacity:1;transform:translateX(0)}}
  /* 鼠标 */
  .cursor{position:absolute;width:30px;height:30px;z-index:8;pointer-events:none;transition:left .6s cubic-bezier(.4,0,.2,1),top .6s cubic-bezier(.4,0,.2,1)}
  .cursor::before{content:"";position:absolute;left:0;top:0;width:0;height:0;border-left:14px solid #333;border-top:8px solid transparent;border-bottom:8px solid transparent;transform:rotate(-30deg)}
  .click-ring{position:absolute;width:40px;height:40px;border:3px solid #6366f1;border-radius:50%;opacity:0;transform:translate(-50%,-50%);pointer-events:none;z-index:9}
  .click-ring.fire{animation:ring .5s ease-out}
  @keyframes ring{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}

  /* ===== Skild 场景：球场对练 ===== */
  .scene-skild{background:linear-gradient(180deg,#1e3a5f,#0f1f33)}
  .field{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:760px;height:480px;background:linear-gradient(135deg,#2d6a3e,#1f4d2b);border-radius:16px;border:3px solid rgba(255,255,255,.25);overflow:hidden}
  .field::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:rgba(255,255,255,.3);transform:translateX(-50%)}
  .field::after{content:"";position:absolute;left:50%;top:50%;width:80px;height:80px;border:3px solid rgba(255,255,255,.3);border-radius:50%;transform:translate(-50%,-50%)}
  .goal{position:absolute;top:50%;transform:translateY(-50%);width:14px;height:120px;background:rgba(255,255,255,.4)}
  .goal.l{left:0}.goal.r{right:0}
  .robot{position:absolute;width:56px;height:72px;border-radius:12px 12px 8px 8px;transition:left .5s,top .5s;z-index:3}
  .robot .head{width:44px;height:30px;margin:6px auto 0;border-radius:8px;background:#1a1a1a;border:2px solid #00e5ff;position:relative}
  .robot .head::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24px;height:6px;background:#00e5ff;border-radius:3px;box-shadow:0 0 8px #00e5ff}
  .robot .body{width:44px;height:32px;margin:2px auto 0;border-radius:6px;background:#e8e8e8}
  .robot.r1 .body{background:#4ade80}.robot.r2 .body{background:#f87171}
  .ball{position:absolute;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#ddd);box-shadow:0 0 12px rgba(255,255,255,.4);z-index:4;transition:left .5s,top .5s}

  /* ===== Colibrì 场景：搬书 ===== */
  .scene-colibri{background:linear-gradient(135deg,#0f172a,#1e293b)}
  .layers{position:absolute;inset:30px;display:flex;flex-direction:column;gap:18px}
  .layer{flex:1;border-radius:16px;display:flex;align-items:center;padding:0 28px;gap:24px;position:relative;overflow:hidden}
  .layer .label{font-size:22px;font-weight:800;color:#fff;width:140px;flex-shrink:0}
  .layer .sub{font-size:14px;color:rgba(255,255,255,.6);width:140px;flex-shrink:0}
  .layer.hdd{background:linear-gradient(90deg,rgba(120,80,40,.4),rgba(120,80,40,.15));border:2px solid rgba(180,140,80,.5)}
  .layer.ram{background:linear-gradient(90deg,rgba(60,120,200,.4),rgba(60,120,200,.15));border:2px solid rgba(100,160,240,.5)}
  .layer.vram{background:linear-gradient(90deg,rgba(180,60,140,.4),rgba(180,60,140,.15));border:2px solid rgba(240,100,200,.5)}
  .blocks{display:flex;gap:10px;flex-wrap:wrap}
  .block{width:44px;height:44px;border-radius:8px;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#333;transition:all .6s}
  .block.active{box-shadow:0 0 16px rgba(255,255,255,.6);transform:scale(1.1)}
  .arrow{position:absolute;left:50%;transform:translateX(-50%);font-size:28px;color:rgba(255,255,255,.5);z-index:5}

  /* 对话气泡 */
  .bubble{position:absolute;top:870px;width:700px;background:#fffdf8;border:3px solid #c9b89a;border-radius:36px;padding:28px 38px;box-shadow:0 12px 32px rgba(120,90,40,.14);font-size:32px;line-height:1.5;font-weight:600;color:#3d2a14;z-index:6;transition:left .35s,right .35s;animation:bubblePop .35s cubic-bezier(.34,1.56,.64,1)}
  @keyframes bubblePop{0%{transform:scale(.85);opacity:0}100%{opacity:1}}
  .bubble.from-dog{left:60px}
  .bubble.from-cat{right:60px;left:auto}
  .bubble.from-dog::after{left:120px}
  .bubble.from-dog::before{left:120px}
  .bubble.from-cat::after{right:120px;left:auto}
  .bubble.from-cat::before{right:120px;left:auto}
  .bubble::after{content:"";position:absolute;bottom:-28px;width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:28px solid #c9b89a}
  .bubble::before{content:"";position:absolute;bottom:-21px;width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:24px solid #fffdf8;z-index:1}
  .who{display:block;font-size:22px;color:#b08a5a;font-weight:800;margin-bottom:10px}

  .pet{position:absolute;bottom:280px;width:420px;z-index:3;transition:transform .4s cubic-bezier(.34,1.56,.64,1),filter .4s ease}
  .pet.dog{left:40px}.pet.cat{right:40px}
  .pet img{width:100%;height:auto;display:block;filter:drop-shadow(0 14px 20px rgba(120,80,30,.18));transform-origin:50% 60%}
  .speaking{transform:scale(1.05) translateY(-8px)}
  .speaking img{filter:drop-shadow(0 22px 30px rgba(150,100,40,.32));animation:headBob 1.1s ease-in-out infinite}
  .silent{opacity:.8}
  .silent img{animation:idle 4s ease-in-out infinite}
  @keyframes headBob{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
  @keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

  .news{position:absolute;left:80px;right:80px;bottom:120px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;z-index:5}
  .card{padding:24px 22px;border-radius:26px;border:2px solid rgba(120,90,40,.14);background:rgba(255,253,248,.72)}
  .card b{display:block;font-size:25px;color:#5a4020;margin-bottom:10px;font-weight:800}
  .card span{display:block;font-size:19px;color:#8a7050;line-height:1.4;font-weight:500}
  .card.c1{background:rgba(255,244,214,.78)}.card.c2{background:rgba(224,245,226,.78)}.card.c3{background:rgba(220,238,252,.78)}
  .card.hl{border-color:#d4a050;box-shadow:0 0 0 3px rgba(212,160,80,.25)}

  .progress{position:absolute;left:80px;right:80px;bottom:60px;display:flex;align-items:center;gap:18px;z-index:5;color:#a08060;font-size:20px;font-weight:600}
  .bar{flex:1;height:8px;border-radius:4px;background:rgba(120,90,40,.12)}
  .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#d4a050,#c97a3a);width:0}
</style>
</head>
<body>
<div class="page" id="page">
  <div class="paper"></div>
  <div class="topbar">
    <div class="brand">猫狗说快讯<small>· 每日 AI</small></div>
    <div class="date">2026 / 09 / 28</div>
  </div>

  <!-- 动态讲解区 -->
  <div class="visual">
    <div class="tag" id="visualTag">Kimi 浏览器扩展</div>

    <!-- Kimi 场景 -->
    <div class="scene scene-kimi active" id="scene-kimi">
      <div class="browser">
        <div class="browser-bar">
          <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
          <div class="url">🔒 bilibili.com</div>
        </div>
        <div class="browser-body">
          <div class="web-title">视频投稿</div>
          <div class="web-row" id="row1"><div class="ico">📤</div><div><div class="t">上传视频</div><div class="d">点击选择文件</div></div></div>
          <div class="web-row" id="row2"><div class="ico">✏️</div><div><div class="t">填写信息</div><div class="d">标题、标签、分区</div></div></div>
          <div class="web-row" id="row3"><div class="ico">🚀</div><div><div class="t">发布</div><div class="d">提交投稿</div></div></div>
          <div class="cursor" id="cursor"></div>
          <div class="click-ring" id="ring"></div>
          <div class="steps" id="steps">
            <h4><div class="rec"></div>录制中 · 视频发布</h4>
          </div>
        </div>
      </div>
    </div>

    <!-- Skild 场景 -->
    <div class="scene scene-skild" id="scene-skild">
      <div class="field">
        <div class="goal l"></div>
        <div class="goal r"></div>
        <div class="robot r1" id="r1" style="left:160px;top:180px"></div>
        <div class="robot r2" id="r2" style="left:540px;top:240px"></div>
        <div class="ball" id="ball" style="left:370px;top:220px"></div>
      </div>
    </div>

    <!-- Colibrì 场景 -->
    <div class="scene scene-colibri" id="scene-colibri">
      <div class="layers">
        <div class="layer hdd">
          <div class="label">硬盘 HDD</div>
          <div class="sub">闲置权重</div>
          <div class="blocks" id="hddBlocks"></div>
        </div>
        <div class="layer ram">
          <div class="label">内存 RAM</div>
          <div class="sub">按需加载</div>
          <div class="blocks" id="ramBlocks"></div>
        </div>
        <div class="layer vram">
          <div class="label">显存 VRAM</div>
          <div class="sub">正在计算</div>
          <div class="blocks" id="vramBlocks"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="bubble" id="bubble"><span class="who" id="who">金渐层</span><span id="text">今天有啥新鲜事？</span></div>

  <div class="pet dog speaking" id="dog">
    <img src="pet-dog.png" alt="西高地"><!-- TODO: 替换为真实宠物抠图 -->
  </div>
  <div class="pet cat silent" id="cat">
    <img src="pet-cat.png" alt="金渐层"><!-- TODO: 替换为真实宠物抠图 -->
  </div>

  <div class="news">
    <div class="card c1" id="card1"><b>Kimi 浏览器扩展</b><span>演示一次流程，下次复用；省重复操作。</span></div>
    <div class="card c2" id="card2"><b>Skild 机器人踢球</b><span>模拟对练 → 真机验证；非家务机器人。</span></div>
    <div class="card c3" id="card3"><b>Colibrì 跑大模型</b><span>闲置权重放硬盘；能跑不等于流畅。</span></div>
  </div>
  <div class="progress"><div class="bar"><i id="barFill"></i></div><span id="pg">第 1 / 24 句</span></div>
</div>

<script>
const script=window.SCRIPT=[
  // TODO: 替换为实际对话脚本，格式 {who:'cat'|'dog', name:'角色名', text:'台词'}
  {who:'cat',name:'金渐层',text:'今天有啥新鲜事？'},
  {who:'dog',name:'西高地',text:'三条。第一条，…'},
];

const text=document.getElementById('text'),who=document.getElementById('who'),pg=document.getElementById('pg');
const barFill=document.getElementById('barFill');
const bubble=document.getElementById('bubble');
const dog=document.getElementById('dog'),cat=document.getElementById('cat');
const visualTag=document.getElementById('visualTag');
const scenes={kimi:document.getElementById('scene-kimi'),skild:document.getElementById('scene-skild'),colibri:document.getElementById('scene-colibri')};
const cards=[document.getElementById('card1'),document.getElementById('card2'),document.getElementById('card3')];

function topicFor(idx){
  if(idx<=8) return 'kimi';
  if(idx<=13) return 'skild';
  if(idx<=19) return 'colibri';
  return 'kimi';
}
const TOPIC_TAG={kimi:'Kimi 浏览器扩展',skild:'Skild 机器人踢球',colibri:'Colibrì 跑大模型'};

let curTopic='';
let lastTopic='';
let tickTimer=null;

function render(idx){
  const line=script[idx];
  who.textContent=line.name;
  text.textContent=line.text;
  bubble.classList.toggle('from-dog',line.who==='dog');
  bubble.classList.toggle('from-cat',line.who==='cat');
  dog.classList.toggle('speaking',line.who==='dog');
  dog.classList.toggle('silent',line.who!=='dog');
  cat.classList.toggle('speaking',line.who==='cat');
  cat.classList.toggle('silent',line.who!=='cat');
  pg.textContent=`第 ${idx+1} / ${script.length} 句`;
  barFill.style.width=`${(idx+1)/script.length*100}%`;

  const t=topicFor(idx);
  if(t!==curTopic){
    curTopic=t;
    Object.entries(scenes).forEach(([k,el])=>el.classList.toggle('active',k===t));
    visualTag.textContent=TOPIC_TAG[t];
    cards.forEach((c,i)=>c.classList.toggle('hl',(t==='kimi'&&i===0)||(t==='skild'&&i===1)||(t==='colibri'&&i===2)));
  }
  if(t!==lastTopic){
    lastTopic=t;
    if(tickTimer){clearInterval(tickTimer);tickTimer=null}
    if(t==='kimi'){initKimi();tickTimer=setInterval(tickKimi,1800)}
    else if(t==='skild'){tickTimer=setInterval(tickSkild,1200)}
    else if(t==='colibri'){initColibri();tickTimer=setInterval(tickColibri,1500)}
  }
}
window.render=render;

// ===== Kimi 动画：鼠标点击网页，步骤逐条记录 =====
let kimiPhase=0;
const kimiTargets=[
  {row:'row1',step:'打开 bilibili.com'},
  {row:'row2',step:'点击"上传视频"按钮'},
  {row:'row3',step:'填写标题并发布'},
];
function tickKimi(){
  const row=document.getElementById(kimiTargets[kimiPhase%3].row);
  const r=row.getBoundingClientRect();
  const pr=document.querySelector('.browser-body').getBoundingClientRect();
  const cursor=document.getElementById('cursor');
  const ring=document.getElementById('ring');
  cursor.style.left=(r.left-pr.left+r.width/2-15)+'px';
  cursor.style.top=(r.top-pr.top+r.height/2-15)+'px';
  setTimeout(()=>{
    ring.style.left=(r.left-pr.left+r.width/2)+'px';
    ring.style.top=(r.top-pr.top+r.height/2)+'px';
    ring.classList.remove('fire');void ring.offsetWidth;ring.classList.add('fire');
    // 加步骤
    const steps=document.getElementById('steps');
    const s=document.createElement('div');
    s.className='step';
    const n=steps.querySelectorAll('.step').length+1;
    s.innerHTML=`<div class="num">${n}</div>${kimiTargets[kimiPhase%3].step}`;
    s.style.animationDelay='0s';
    steps.appendChild(s);
    if(steps.querySelectorAll('.step').length>3){
      steps.removeChild(steps.querySelector('.step'));
      // 重新编号
      steps.querySelectorAll('.step .num').forEach((el,i)=>el.textContent=i+1);
    }
    kimiPhase++;
  },400);
}

// ===== Skild 动画：两机器人追球 =====
let skildPhase=0;
const ballPositions=[
  {bx:370,by:220,r1x:160,r1y:180,r2x:540,r2y:240},
  {bx:300,by:200,r1x:220,r1y:190,r2x:500,r2y:220},
  {bx:460,by:240,r1x:300,r1y:220,r2x:420,r2y:250},
  {bx:200,by:180,r1x:260,r1y:170,r2x:480,r2y:210},
  {bx:600,by:200,r1x:400,r1y:190,r2x:560,r2y:220},
];
function tickSkild(){
  const p=ballPositions[skildPhase%ballPositions.length];
  document.getElementById('ball').style.left=p.bx+'px';
  document.getElementById('ball').style.top=p.by+'px';
  document.getElementById('r1').style.left=p.r1x+'px';
  document.getElementById('r1').style.top=p.r1y+'px';
  document.getElementById('r2').style.left=p.r2x+'px';
  document.getElementById('r2').style.top=p.r2y+'px';
  skildPhase++;
}

// ===== Colibrì 动画：方块从硬盘搬到内存再到显存 =====
let colibriPhase=0;
function initColibri(){
  const hdd=document.getElementById('hddBlocks');
  const ram=document.getElementById('ramBlocks');
  const vram=document.getElementById('vramBlocks');
  hdd.innerHTML='';ram.innerHTML='';vram.innerHTML='';
  for(let i=0;i<8;i++){
    const b=document.createElement('div');b.className='block';b.textContent=i+1;hdd.appendChild(b);
  }
}
function tickColibri(){
  const hdd=document.getElementById('hddBlocks');
  const ram=document.getElementById('ramBlocks');
  const vram=document.getElementById('vramBlocks');
  // 从硬盘取一个到内存
  if(hdd.children.length>0){
    const b=hdd.children[0];
    b.classList.add('active');
    setTimeout(()=>{
      ram.appendChild(b);
      b.classList.remove('active');
      // 内存到显存
      setTimeout(()=>{
        if(ram.children.length>0){
          const b2=ram.children[0];
          b2.classList.add('active');
          setTimeout(()=>{
            vram.appendChild(b2);
            b2.classList.remove('active');
            // 显存满了清空回硬盘
            if(vram.children.length>3){
              while(vram.children.length>1){
                hdd.appendChild(vram.children[0]);
              }
            }
          },500);
        }
      },400);
    },500);
  } else {
    initColibri();
  }
  colibriPhase++;
}

function initKimi(){
  kimiPhase=0;
  document.getElementById('steps').innerHTML='<h4><div class="rec"></div>录制中 · 视频发布</h4>';
}

let idx=0;
window.render=render;
render(0);
</script>
</body>
</html>
