<svg width="360" height="480" viewBox="0 0 360 480" xmlns="http://www.w3.org/2000/svg">
  <!-- 封面模板：极简杂志风 -->
  <!-- 可替换变量：{{ACCENT_COLOR}}, {{MAIN_TITLE}}, {{SUB_TITLE}}, {{TAG1}}, {{TAG2}}, {{TAG3}}, {{META_LINE}} -->

  <defs>
    <linearGradient id="coverBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAF8F5"/>
      <stop offset="1" stop-color="#F0EBE3"/>
    </linearGradient>
  </defs>

  <rect width="360" height="480" fill="url(#coverBg)"/>
  <rect x="0" y="0" width="360" height="6" fill="{{ACCENT_COLOR}}"/>

  <text x="24" y="44" font-size="11" fill="#999" font-family="monospace" letter-spacing="2">VOL.{{ISSUE_NO}} · {{DATE}}</text>
  <text x="336" y="44" font-size="11" fill="#999" text-anchor="end" font-family="monospace">AI BRIEF</text>
  <line x1="24" y1="58" x2="336" y2="58" stroke="#ddd"/>

  <text x="24" y="100" font-size="14" fill="{{ACCENT_COLOR}}" font-weight="bold" letter-spacing="3">{{CATEGORY}}</text>
  <text x="20" y="175" font-size="68" font-weight="bold" fill="#1A1A1A" font-family="Georgia, serif">{{MAIN_TITLE}}</text>
  <text x="24" y="210" font-size="20" fill="#333" font-weight="bold">{{SUB_TITLE}}</text>

  <rect x="24" y="232" width="290" height="32" rx="16" fill="{{ACCENT_COLOR}}" opacity="0.1"/>
  <text x="169" y="253" font-size="13" fill="{{ACCENT_COLOR}}" text-anchor="middle" font-weight="bold">{{ONE_LINER}}</text>

  <!-- 右侧极简线稿机器人 -->
  <g transform="translate(285, 110)" stroke="#1A1A1A" stroke-width="1.8" fill="none">
    <line x1="0" y1="-48" x2="0" y2="-34" stroke="#999" stroke-width="2"/>
    <circle cx="0" cy="-50" r="4" fill="#FF4500" stroke="none"/>
    <rect x="-36" y="-34" width="72" height="68" rx="18"/>
    <rect x="-26" y="-20" width="52" height="38" rx="8"/>
    <circle cx="-12" cy="0" r="3" fill="#1A1A1A"/>
    <circle cx="12" cy="0" r="3" fill="#1A1A1A"/>
    <path d="M -6 14 Q 0 18 6 14" stroke-linecap="round"/>
    <rect x="-44" y="-18" width="8" height="16" rx="4" fill="#1A1A1A" stroke="none"/>
    <rect x="36" y="-18" width="8" height="16" rx="4" fill="#1A1A1A" stroke="none"/>
  </g>

  <line x1="24" y1="320" x2="336" y2="320" stroke="#ddd"/>

  <g font-family="sans-serif">
    <rect x="24" y="340" width="100" height="28" rx="14" fill="{{TAG1_BG}}"/>
    <text x="74" y="359" font-size="12" fill="{{TAG1_COLOR}}" text-anchor="middle" font-weight="bold">{{TAG1}}</text>

    <rect x="132" y="340" width="100" height="28" rx="14" fill="{{TAG2_BG}}"/>
    <text x="182" y="359" font-size="12" fill="{{TAG2_COLOR}}" text-anchor="middle" font-weight="bold">{{TAG2}}</text>

    <rect x="240" y="340" width="96" height="28" rx="14" fill="{{TAG3_BG}}"/>
    <text x="288" y="359" font-size="12" fill="{{TAG3_COLOR}}" text-anchor="middle" font-weight="bold">{{TAG3}}</text>
  </g>

  <text x="24" y="410" font-size="12" fill="#888">{{META_LINE}}</text>

  <rect x="24" y="440" width="312" height="3" fill="{{ACCENT_COLOR}}"/>
  <text x="24" y="465" font-size="11" fill="#999">右滑了解详情 →</text>
</svg>
